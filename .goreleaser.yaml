version: 2

project_name: tail-gunner

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/tail-gunner
    binary: tail-gunner
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

# defaults produce tar.gz (zip for windows) named
# tail-gunner_<version>_<os>_<arch> plus a checksums file

changelog:
  filters:
    exclude:
      - "^docs"
      - "^test"
