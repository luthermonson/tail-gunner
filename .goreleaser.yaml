version: 2

project_name: tail-gunner

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/tail-gunner
    binary: tail-gunner
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  filters:
    exclude:
      - "^docs"
      - "^test"
