name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - run: go vet ./...

      - run: go test ./...

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -o tail-gunner.exe ./cmd/tail-gunner
          else
            go build -o tail-gunner ./cmd/tail-gunner
          fi

      # The drop-in contract: pipe-mode output must be byte-identical to GNU
      # tail. Linux has GNU tail natively, Windows gets it via Git Bash, and
      # macOS ships BSD tail so we use coreutils' gtail.
      - name: Golden suite (GNU tail diff)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            command -v gtail >/dev/null || brew install coreutils
            export GNU_TAIL=gtail
          fi
          bash test/golden.sh
